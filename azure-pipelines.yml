trigger:
  branches:
    include:
      - dev_master

variables:
  NODE_VERSION: '22.x'
  FUNCTIONAPP_NAME: 'function-app-henry'
  AZURE_SERVICE_CONNECTION: 'dev'
  PACKAGE_PATH: '$(Build.ArtifactStagingDirectory)/functionapp.zip'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build Function App'
  jobs:
  - job: Build
    displayName: 'Build Node.js Function'
    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: NodeTool@0
      displayName: 'Install Node.js 22'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - script: npm ci
      displayName: 'Install dependencies'

    - task: ArchiveFiles@2
      displayName: 'Create deployment package'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(PACKAGE_PATH)'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Function artifact'
      inputs:
        PathtoPublish: '$(PACKAGE_PATH)'
        ArtifactName: 'functionapp'
        publishLocation: 'Container'

- stage: Deploy_Dev
  displayName: 'Deploy to Dev'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployFunction
    displayName: 'Deploy Azure Function App'
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Function artifact'
            inputs:
              artifactName: 'functionapp'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: AzureFunctionApp@2
            displayName: 'Deploy Node.js Function App'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: 'functionAppLinux'
              appName: '$(FUNCTIONAPP_NAME)'
              package: '$(System.ArtifactsDirectory)/functionapp/functionapp.zip'
